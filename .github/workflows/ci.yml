# CI: en cada push y pull request instala, revisa tipos, corre las pruebas, compila,
# corre Playwright y las pruebas de ml/ (Python). Si todo pasa en la rama main, publica en Cloudflare (y solo entonces).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verificar:
    name: Instalar, revisar y probar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # pnpm toma la versión de "packageManager" en package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # ffmpeg: lo usan las pruebas de precisión (videos sintéticos) y Playwright (cámara falsa).
      - name: Instalar ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Revisar tipos
        run: pnpm typecheck

      - name: Pruebas unitarias y de precisión
        run: pnpm test

      - name: Compilar la app
        run: pnpm build:web

      - name: Guardar la app compilada
        uses: actions/upload-artifact@v4
        with:
          name: app-compilada
          path: apps/web/dist
          include-hidden-files: true
          retention-days: 7

      - name: Instalar Chromium para Playwright
        run: pnpm --filter @contador/web exec playwright install --with-deps chromium

      - name: Pruebas de punta a punta (sin scroll, conteo en vivo, sin internet)
        run: pnpm e2e

      - name: Guardar el informe de Playwright si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  ml:
    name: Pruebas de ml (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements-*.txt

      - name: Instalar ffmpeg y las librerías de datos (sin PyTorch)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -r ml/requirements-pruebas.txt

      - name: Pruebas de los pasos de datos
        working-directory: ml
        run: python -m pytest -q tests

  publicar:
    name: Publicar en Cloudflare
    needs: [verificar, ml]
    # Solo pushes a main que pasaron todo; nunca pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: publicar
      cancel-in-progress: false
    environment:
      name: produccion
      url: https://contador.ibsen-soto.pro
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Revisar que estén las claves de Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltan los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID. Ver docs/guias/desarrollo/publicar-una-version.md"
            exit 1
          fi

      # Se publica exactamente lo que se compiló y se probó en «verificar».
      - name: Traer la app compilada
        uses: actions/download-artifact@v4
        with:
          name: app-compilada
          path: apps/web/dist

      # setup-node v5 activa sola la caché de pnpm (por «packageManager» en package.json),
      # pero aquí no se instala pnpm: solo hace falta Node para wrangler.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # Cloudflare Pages: proyecto «contador-alevinos» (contador-alevinos.pages.dev), con el
      # dominio contador.ibsen-soto.pro. La primera vez se crea solo.
      - name: Crear el proyecto de Pages si no existe
        run: |
          if npx --yes wrangler@4.151.1 pages project list | grep -qw contador-alevinos; then
            echo "El proyecto contador-alevinos ya existe."
          else
            npx --yes wrangler@4.151.1 pages project create contador-alevinos --production-branch main
          fi

      - name: Publicar en Cloudflare Pages
        run: npx --yes wrangler@4.151.1 pages deploy apps/web/dist --project-name contador-alevinos --branch main
